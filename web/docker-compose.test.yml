services:
  postgres-test:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metafashion_test
    ports:
      # Overridable so this can coexist with another project already on 5433.
      # scripts/test-db.sh passes the same default.
      - "${METAFASHION_TEST_DB_PORT:-5433}:5432"
    volumes:
      - metafashion_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metafashion_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  metafashion_test_pgdata:
