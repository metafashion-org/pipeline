name: Sign-off digest

# Emails Arjun the assets newly waiting for his sign-off, every 2 hours from 10:00 to 20:00 India
# time. Vercel's Hobby plan runs crons once a day, so the schedule lives here and calls the app's
# endpoint, which sends nothing when no new asset is waiting. The endpoint needs no secret (see
# web/app/api/cron/signoff-digest/route.ts).

on:
  schedule:
    # 04:30, 06:30 ... 14:30 UTC = 10:00, 12:00 ... 20:00 IST (UTC+5:30).
    - cron: "30 4,6,8,10,12,14 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send the sign-off digest
        # --fail-with-body fails the run (and GitHub emails the repo owner) when the app errors.
        run: curl --fail-with-body --silent --show-error https://kanban.metafashion.in/api/cron/signoff-digest
